name: Lean theorem audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDITED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: native-carry-spectral-weyl-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Exact-checkout Lean theorem audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exact audited commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.AUDITED_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Reject a synthetic or dirty checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUDITED_SHA"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Set up pinned Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Build with warnings as errors
        shell: bash
        run: lake build --wfail NativeCarrySpectralWeyl

      - name: Check theorem registry and claim coverage
        shell: bash
        run: python3 scripts/check_registry.py

      - name: Check named foundational dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake env lean NativeCarrySpectralWeyl/Audit.lean | tee /tmp/native-carry-spectral-weyl-axioms.txt
          python3 scripts/check_axiom_output.py /tmp/native-carry-spectral-weyl-axioms.txt

      - name: Reject Lean trust escapes
        shell: bash
        run: |
          set -euo pipefail
          if rg -n --glob '*.lean' '(^|[^A-Za-z])(sorry|admit|axiom|unsafe)([^A-Za-z]|$)' NativeCarrySpectralWeyl NativeCarrySpectralWeyl.lean; then
            exit 1
          fi
